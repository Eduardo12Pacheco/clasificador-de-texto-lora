# D5 grid for the TF-IDF + linear baseline.
# Every configuration is fitted on the cleaned train split, scored on dev and
# recorded in search.json. Selection: max dev macro-F1, tie -> higher accuracy
# -> fewer features.

[grid]
word_ngrams = [[1, 2], [1, 3]]
char_ngrams = [[2, 5], [3, 6]]
svc_c = [0.1, 0.25, 0.5, 1.0, 2.0]
class_weights = ["none", "balanced"]
logreg_c = [10.0, 30.0]
logreg_max_iter = 2000
random_state = 13
quick_configs = 2
