name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Verify that the tag matches the package version
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          version = project["project"]["version"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"tag {tag!r} does not match package version {expected!r}")
          print(f"tag {tag} matches package version {version}")
          PY
      - name: Build the wheel and sdist
        run: uv build
      - name: Refuse to publish oversized assets
        run: |
          if find dist -type f -size +100M | grep -q .; then
            echo "error: release assets above 100 MB are not allowed; weights ship via publish_model.sh" >&2
            exit 1
          fi
          ls -lh dist
      - name: Generate release notes from Conventional Commits
        run: uvx git-cliff --latest --strip header -o RELEASE_NOTES.md
      - name: Write checksums
        run: sha256sum dist/* > SHA256SUMS
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
