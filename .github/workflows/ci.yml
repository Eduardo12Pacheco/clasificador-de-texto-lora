name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv sync --locked --group dev --python 3.12
      - name: Check the lockfile
        run: uv lock --check
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type-check
        run: uv run mypy src
      - name: Check import contracts
        run: uv run lint-imports
      - name: Check repository artifact policy
        run: uv run python scripts/check_no_weights.py
      - name: Validate workflows
        run: uv run python scripts/validate_workflows.py

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv sync --locked --group dev --python 3.12
      - name: Run tests
        run: uv run pytest -q -m "not e2e and not torch"

  test-torch:
    name: test-torch (coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python and training dependencies
        run: |
          uv python install 3.12
          uv sync --locked --extra train --group dev --python 3.12
      - name: Run the full suite with coverage
        run: uv run pytest -q -m "not e2e" --cov=src/stc --cov-fail-under=85
